[package]
name = "rjtd-export"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Experimental plain text exporter for OpenJTD documents."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rjtd-export"
readme = "README.md"
keywords = ["ichitaro", "jtd", "document", "text", "txt"]
categories = ["encoding", "text-processing"]
publish = ["crates-io"]
include = ["src/**/*.rs", "README.md", "LICENSE"]

[lib]
doctest = false

[dependencies]
rjtd-core = { version = "0.0.1", path = "../rjtd-core" }
rjtd-model = { version = "0.0.1", path = "../rjtd-model" }

[lints]
workspace = true
